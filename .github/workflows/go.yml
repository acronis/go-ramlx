# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-core:
    name: Core Library
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: 'stable'

    # - uses: golangci/golangci-lint-action@v9
    #   with:
    #     version: latest
    #     args: --timeout=5m -v

    - name: Test
      run: make test

    - name: Update coverage report
      uses: ncruces/go-coverage-report@v0
      with:
        coverage-file: cover.out
      continue-on-error: true

    - name: Vulnerability check
      run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  build-cli:
    name: CLI Utility
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: 'stable'

    # - uses: golangci/golangci-lint-action@v9
    #   with:
    #     version: latest
    #     working-directory: cmd/raml
    #     args: --timeout=5m -v

    - name: Build
      run: make build-cli

  build-lsp:
    name: LSP Server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: 'stable'

    # - uses: golangci/golangci-lint-action@v9
    #   with:
    #     version: latest
    #     working-directory: cmd/raml-lsp
    #     args: --timeout=5m -v

    - name: Build
      run: make build-lsp

    - name: Test
      run: make test-lsp

    - name: Vulnerability check
      run: cd cmd/raml-lsp && go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

